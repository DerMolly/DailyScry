name: Lint

on:
  push:
    branches: [ main ]
    paths: ['src/**', 'rustfmt.toml']
  pull_request:
    branches: [ main ]
    paths: ['src/**', 'rustfmt.toml']

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        - name: Setup rust
          uses: ./.github/actions/setup-rust
          with:
            RUST_VERSION: stable
            RUST_COMPONENTS: rustfmt
        - name: run check fmt
          run: cargo fmt --check